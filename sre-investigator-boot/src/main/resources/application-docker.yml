# Compose 内网主机名 mysql / redis。只给容器用，本机 IDEA 不要开 docker profile。
# 推荐 Active profiles：local,docker（compose 已这样配）
spring:
  datasource:
    url: jdbc:mysql://mysql:3306/sre_investigator?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: sre_investigator
    password: sre_investigator
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  data:
    redis:
      host: redis
      port: 6379
      username: ""
      password: ""
      session:
        database: 2
      memory:
        database: 1

investigator:
  persistence:
    mode: mysql
  model:
    dashscope:
      api-key: ${INVESTIGATOR_MODEL_DASHSCOPE_API_KEY:}
    openai:
      api-key: ${INVESTIGATOR_MODEL_OPENAI_API_KEY:}
      base-url: ${INVESTIGATOR_MODEL_OPENAI_BASE_URL:}
    anthropic:
      api-key: ${INVESTIGATOR_MODEL_ANTHROPIC_API_KEY:}
