# 生产控制面。激活：SPRING_PROFILES_ACTIVE=prod
spring:
  # --- MySQL（控制面）---
  datasource:
    url: jdbc:mysql://生产主机:3306/sre_investigator?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: sre_investigator
    password: ""
    driver-class-name: com.mysql.cj.jdbc.Driver
  # --- Redis（一套连接；Session / 记忆只分库号）---
  data:
    redis:
      host: 生产Redis主机
      port: 6379
      username: ""
      password: ""
      session:
        database: 2
      memory:
        database: 1
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

investigator:
  persistence:
    mode: mysql
